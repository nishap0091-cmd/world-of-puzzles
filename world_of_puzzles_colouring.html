<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#fff4f8">
<title>World of Puzzles — Colouring Fun</title>
<style>
:root{--ink:#30243b;--pink:#ff6fae;--lav:#8b75ff;--paper:#fffdfd}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#fff4f8,#f1f5ff);font-family:system-ui,-apple-system,sans-serif;color:var(--ink)}
header{text-align:center;padding:18px 12px 8px}
h1{font-size:clamp(24px,5vw,38px);margin:0;color:#6e4bc3}
header p{margin:5px 0 10px;font-size:15px}
main{max-width:900px;margin:auto;padding:10px 12px 24px}
.panel{background:#fff;border:2px solid #f1dff2;border-radius:22px;padding:12px;box-shadow:0 8px 24px #67448a12}
.tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:10px 14px;min-height:42px;background:#eee8ff;color:#453078;cursor:pointer}
button:active{transform:scale(.97)}
button.primary{background:#7654d6;color:white}
button.selected{outline:3px solid #30243b;outline-offset:2px}
.palette{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:10px 0 14px}
.swatch{width:38px;height:38px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px #d8d0df;min-height:38px;padding:0}
.swatch.selected{box-shadow:0 0 0 3px #30243b}
.canvas-wrap{width:100%;display:flex;justify-content:center;background:white;border:2px dashed #e3d9f4;border-radius:16px;overflow:hidden;touch-action:manipulation}
canvas{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain;touch-action:manipulation;cursor:crosshair}
.note{text-align:center;font-size:14px;line-height:1.45;color:#665a75;margin:12px 4px 2px}
footer{text-align:center;font-size:12px;padding:0 12px 20px;color:#766a84}
@media(min-width:650px){.panel{padding:18px}canvas{max-width:620px}}
</style>
</head>
<body>
<header>
<h1>🌈 World of Puzzles</h1>
<p>✨ Colouring Fun! ✨</p>
</header>
<main>
<section class="panel">
<div class="tools">
<button id="undo">↶ Undo</button>
<button id="eraser">🧽 Eraser</button>
<button id="reset">↻ Start Again</button>
<button id="save" class="primary">⬇ Save Picture</button>
</div>
<div class="palette" id="palette" aria-label="Choose a colour"></div>
<div class="canvas-wrap"><canvas id="art" aria-label="Tap a part of the picture to colour it"></canvas></div>
<p class="note">Choose a colour, then tap inside a part of the picture to fill it. Try different colours and have fun! 💖</p>
</section>
</main>
<footer>Made for little artists • World of Puzzles</footer>

colors.forEach(([name,color])=>{const b=document.createElement('button');b.className='swatch';b.style.background=color;b.title=name;b.setAttribute('aria-label',name);b.onclick=()=>{selected=color;erasing=false;document.getElementById('eraser').classList.remove('selected');document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};pal.appendChild(b)});
pal.firstChild.classList.add('selected');
const img=new Image();
img.onload=()=>{canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;ctx.drawImage(img,0,0);original=ctx.getImageData(0,0,canvas.width,canvas.height)};
img.src=picture;
function snapshot(){if(!original)return;history.push(ctx.getImageData(0,0,canvas.width,canvas.height));if(history.length>15)history.shift()}
document.getElementById('undo').onclick=()=>{if(history.length)ctx.putImageData(history.pop(),0,0)};
document.getElementById('eraser').onclick=()=>{erasing=!erasing;document.getElementById('eraser').classList.toggle('selected',erasing)};
document.getElementById('reset').onclick=()=>{if(original){snapshot();ctx.putImageData(original,0,0);history=[]}};
document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.download='world-of-puzzles-colouring.jpg';a.href=canvas.toDataURL('image/jpeg',.95);a.click()};
function hexRgb(hex){return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]}
function floodFill(sx,sy){
 if(!original)return;
 const w=canvas.width,h=canvas.height;
 const x=Math.max(0,Math.min(w-1,Math.floor(sx))),y=Math.max(0,Math.min(h-1,Math.floor(sy)));
 const image=ctx.getImageData(0,0,w,h),d=image.data,idx=(y*w+x)*4;
 const target=[d[idx],d[idx+1],d[idx+2],d[idx+3]], fill=erasing?[255,255,255]:[...hexRgb(selected),255];
 if(target[0]<55&&target[1]<55&&target[2]<55)return;
 if(!erasing&&Math.abs(target[0]-fill[0])<8&&Math.abs(target[1]-fill[1])<8&&Math.abs(target[2]-fill[2])<8)return;
 // Fill only near-white/light pixels; black outline acts as the boundary.
 const tolerance=42, seen=new Uint8Array(w*h), stack=[y*w+x], pixels=[];
 while(stack.length){
   const p=stack.pop(); if(p<0||p>=w*h||seen[p])continue;seen[p]=1;
   const i=p*4,r=d[i],g=d[i+1],b=d[i+2];
   if(r<170||g<170||b<170)continue;
   if(Math.abs(r-target[0])>tolerance||Math.abs(g-target[1])>tolerance||Math.abs(b-target[2])>tolerance)continue;
   pixels.push(i);
   const px=p%w,py=(p/w)|0;
   if(px>0)stack.push(p-1);if(px<w-1)stack.push(p+1);if(py>0)stack.push(p-w);if(py<h-1)stack.push(p+w);
 }
 if(!pixels.length)return;
 snapshot();
 for(const i of pixels){d[i]=fill[0];d[i+1]=fill[1];d[i+2]=fill[2];d[i+3]=255}
 ctx.putImageData(image,0,0);
}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();floodFill((e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height)});
</script>
